kind = "web"
previewPath = "/"
title = "The March of AI"
version = "1.0.0"
id = "artifacts/march-of-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22454

[services.development]
run = "pnpm --filter @workspace/march-of-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/march-of-ai", "run", "build" ]
publicDir = "artifacts/march-of-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22454"
BASE_PATH = "/"
